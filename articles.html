<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2591c9">
<title>المقالات - Sparemail</title>
<meta name="description" content="مقالات عن الخصوصية الرقمية، البريد المؤقت، وحماية بياناتك أونلاين.">
<link rel="stylesheet" href="/pages.css">
</head>
<body>

<div class="page-wrap">
  <div class="site-header">
    <a class="site-logo" href="/">
      <img src="/favicon.png" alt="Sparemail">
      <span>Sparemail</span>
    </a>
    <a class="back-link" href="/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      الرئيسية
    </a>
  </div>

  <div class="page-card">
    <h1 class="page-title">المقالات</h1>
    <p class="page-updated">مقالات عن الخصوصية والبريد المؤقت</p>

    <a href="/add-article.html" class="add-article-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      إضافة مقال جديد
    </a>

    <div class="articles-page-grid" id="articlesGrid">
      <p class="empty-note">جاري تحميل المقالات...</p>
    </div>
  </div>
</div>

<div class="site-footer">
  <a href="/">الرئيسية</a>
  <a href="/articles.html">المقالات</a>
  <a href="/about.html">من نحن</a>
  <a href="/contact.html">تواصل معنا</a>
  <a href="/privacy.html">سياسة الخصوصية</a>
  <a href="/terms.html">الشروط والأحكام</a>
</div>

<script>
  const FIREBASE_URL = 'https://sparemail-87ef2-default-rtdb.europe-west1.firebasedatabase.app';
  const ARTICLES_ENDPOINT = `${FIREBASE_URL}/articles.json`;
  const articlesGrid = document.getElementById('articlesGrid');

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  async function loadArticles(){
    try{
      const res = await fetch(ARTICLES_ENDPOINT);
      if(!res.ok) throw new Error('fetch failed');
      const data = await res.json();

      if(!data || typeof data !== 'object'){
        articlesGrid.innerHTML = '<p class="empty-note">مفيش مقالات لسه. كن أول من ينشر!</p>';
        return;
      }

      const articles = Object.entries(data)
        .map(([id, val]) => ({ id, ar: val.ar, image: val.image || null, ts: val.ts || 0 }))
        .sort((a, b) => b.ts - a.ts);

      articlesGrid.innerHTML = '';
      articles.forEach(article => {
        const a = document.createElement('a');
        a.className = 'article-card-link';
        a.href = `/article.html?id=${encodeURIComponent(article.id)}`;

        const thumb = document.createElement('div');
        thumb.className = 'article-card-thumb';
        if(article.image){
          const img = document.createElement('img');
          img.src = article.image;
          img.alt = '';
          thumb.appendChild(img);
        } else {
          thumb.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
        }

        const title = document.createElement('div');
        title.className = 'article-card-link-title';
        title.textContent = article.ar;

        a.appendChild(thumb);
        a.appendChild(title);
        articlesGrid.appendChild(a);
      });
    }catch(err){
      articlesGrid.innerHTML = '<p class="empty-note">تعذّر تحميل المقالات - تحقق من الاتصال.</p>';
    }
  }

  loadArticles();
</script>

</body>
</html>
