<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var t = localStorage.getItem('sparemail_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2591c9">
<title>المقالات - Sparemail</title>
<meta name="description" content="مقالات عن الخصوصية الرقمية، البريد المؤقت، وحماية بياناتك أونلاين.">
<link rel="stylesheet" href="/pages.css">
</head>
<body>

<div class="page-wrap">
  <div class="site-header">
    <a class="site-logo" href="/" onclick="event.preventDefault(); location.replace('/');">
      <img src="/favicon.png" alt="Sparemail">
      <span>Sparemail</span>
    </a>
    <div class="header-controls">
      <button class="header-toggle-btn" id="themeToggleBtn" aria-label="تبديل الوضع الليلي/النهاري" title="الوضع الليلي/النهاري">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button class="header-toggle-btn" id="langToggleBtn" aria-label="Switch language" title="EN / AR">
        <span data-ar="EN" data-en="AR">EN</span>
      </button>
    </div>
    <a class="back-link" href="/" onclick="event.preventDefault(); location.replace('/');">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span data-ar="الرئيسية" data-en="Home">الرئيسية</span>
    </a>
  </div>

  <div class="page-card">
    <h1 class="page-title" data-ar="المقالات" data-en="Articles">المقالات</h1>
    <p class="page-updated" data-ar="مقالات عن الخصوصية والبريد المؤقت" data-en="Articles about privacy and temporary email">مقالات عن الخصوصية والبريد المؤقت</p>

    <a href="/add-article.html" class="add-article-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span data-ar="إضافة مقال جديد" data-en="Add New Article">إضافة مقال جديد</span>
    </a>

    <div class="articles-page-grid" id="articlesGrid">
      <p class="empty-note" data-ar="جاري تحميل المقالات..." data-en="Loading articles...">جاري تحميل المقالات...</p>
    </div>
  </div>
</div>

<div class="site-footer">
  <a href="/" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
  <a href="/articles.html" data-ar="المقالات" data-en="Articles">المقالات</a>
  <a href="/about.html" data-ar="من نحن" data-en="About">من نحن</a>
  <a href="/contact.html" data-ar="تواصل معنا" data-en="Contact">تواصل معنا</a>
  <a href="/privacy.html" data-ar="سياسة الخصوصية" data-en="Privacy Policy">سياسة الخصوصية</a>
  <a href="/terms.html" data-ar="الشروط والأحكام" data-en="Terms">الشروط والأحكام</a>
</div>

<script src="/pages.js"></script>
<script>
  const FIREBASE_URL = 'https://sparemail-87ef2-default-rtdb.europe-west1.firebasedatabase.app';
  const ARTICLES_ENDPOINT = `${FIREBASE_URL}/articles.json`;
  const articlesGrid = document.getElementById('articlesGrid');

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  async function loadArticles(){
    const isEn = document.documentElement.lang === 'en';
    try{
      const res = await fetch(ARTICLES_ENDPOINT);
      if(!res.ok) throw new Error('fetch failed');
      const data = await res.json();

      if(!data || typeof data !== 'object'){
        articlesGrid.innerHTML = `<p class="empty-note">${isEn ? 'No articles yet. Be the first to publish!' : 'مفيش مقالات لسه. كن أول من ينشر!'}</p>`;
        return;
      }

      const articles = Object.entries(data)
        .map(([id, val]) => ({ id, ar: val.ar, image: val.image || null, ts: val.ts || 0 }))
        .sort((a, b) => b.ts - a.ts);

      articlesGrid.innerHTML = '';
      articles.forEach(article => {
        const a = document.createElement('a');
        a.className = 'article-card-link';
        a.href = `/article.html?id=${encodeURIComponent(article.id)}`;

        const thumb = document.createElement('div');
        thumb.className = 'article-card-thumb';
        if(article.image){
          const img = document.createElement('img');
          img.src = article.image;
          img.alt = '';
          thumb.appendChild(img);
        } else {
          thumb.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
        }

        const title = document.createElement('div');
        title.className = 'article-card-link-title';
        title.textContent = article.ar;

        a.appendChild(thumb);
        a.appendChild(title);
        articlesGrid.appendChild(a);
      });
    }catch(err){
      articlesGrid.innerHTML = `<p class="empty-note">${isEn ? 'Could not load articles - check your connection.' : 'تعذّر تحميل المقالات - تحقق من الاتصال.'}</p>`;
    }
  }

  loadArticles();
</script>

</body>
</html>
