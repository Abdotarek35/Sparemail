<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var t = localStorage.getItem('sparemail_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2591c9">
<meta name="robots" content="noindex, nofollow">
<title>إضافة مقال جديد - Sparemail</title>
<meta name="description" content="شارك مقالك في Sparemail عن الخصوصية الرقمية والبريد المؤقت.">
<link rel="stylesheet" href="/pages.css">
<style>
  .image-upload{
    position:relative;
    aspect-ratio:16/9;
    border:1.5px dashed var(--border);
    border-radius:16px;
    background:var(--input-bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    color:var(--text-gray);
    overflow:hidden;
    font-size:13px;
    margin-bottom:16px;
  }
  .image-upload img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .image-upload svg{ width:26px; height:26px; opacity:.6; }
</style>
</head>
<body>

<div class="page-wrap">
  <div class="site-header">
    <a class="site-logo" href="/" onclick="event.preventDefault(); location.replace('/');">
      <img src="/favicon.png" alt="Sparemail">
      <span>Sparemail</span>
    </a>
    <div class="header-controls">
      <button class="header-toggle-btn" id="themeToggleBtn" aria-label="تبديل الوضع الليلي/النهاري" title="الوضع الليلي/النهاري">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button class="header-toggle-btn" id="langToggleBtn" aria-label="Switch language" title="EN / AR">
        <span data-ar="EN" data-en="AR">EN</span>
      </button>
    </div>
    <a class="back-link" href="/articles.html" onclick="event.preventDefault(); location.replace('/articles.html');">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span data-ar="المقالات" data-en="Articles">المقالات</span>
    </a>
  </div>

  <div class="page-card">
    <h1 class="page-title" data-ar="إضافة مقال جديد" data-en="Add New Article">إضافة مقال جديد</h1>
    <p class="page-updated" data-ar="مقالك هيتراجع قبل ما يظهر للزوار" data-en="Your article will be reviewed before it appears to visitors">مقالك هيتراجع قبل ما يظهر للزوار</p>

    <form id="articleForm">
      <label class="image-upload" id="imageUploadLabel">
        <input type="file" id="articleImageInput" accept="image/*" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span data-ar="اضغط لإضافة صورة (اختياري)" data-en="Tap to add an image (optional)">اضغط لإضافة صورة (اختياري)</span>
      </label>

      <div class="form-group">
        <label for="titleInput" data-ar="عنوان المقال" data-en="Article title">عنوان المقال</label>
        <input type="text" id="titleInput" required>
      </div>
      <div class="form-group">
        <label for="contentInput" data-ar="محتوى المقال" data-en="Article content">محتوى المقال</label>
        <textarea id="contentInput" required></textarea>
      </div>

      <button type="submit" class="submit-btn" id="publishBtn" data-ar="إرسال للمراجعة" data-en="Submit for Review">إرسال للمراجعة</button>
      <div class="form-status" id="formStatus"></div>
    </form>
  </div>
</div>

<div class="site-footer">
  <a href="/" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
  <a href="/articles.html" data-ar="المقالات" data-en="Articles">المقالات</a>
  <a href="/about.html" data-ar="من نحن" data-en="About">من نحن</a>
  <a href="/contact.html" data-ar="تواصل معنا" data-en="Contact">تواصل معنا</a>
  <a href="/privacy.html" data-ar="سياسة الخصوصية" data-en="Privacy Policy">سياسة الخصوصية</a>
  <a href="/terms.html" data-ar="الشروط والأحكام" data-en="Terms">الشروط والأحكام</a>
</div>

<script src="/pages.js"></script>
<script>
  const FIREBASE_URL = 'https://sparemail-87ef2-default-rtdb.europe-west1.firebasedatabase.app';
  const PENDING_ARTICLES_ENDPOINT = `${FIREBASE_URL}/pending_articles.json`;

  const form = document.getElementById('articleForm');
  const publishBtn = document.getElementById('publishBtn');
  const statusEl = document.getElementById('formStatus');
  const imageUploadLabel = document.getElementById('imageUploadLabel');
  const articleImageInput = document.getElementById('articleImageInput');

  let uploadedImageData = null;

  function compressImage(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(reader.error);
      reader.onload = () => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const maxW = 640;
          const scale = Math.min(1, maxW / img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  articleImageInput.addEventListener('change', async () => {
    const file = articleImageInput.files[0];
    if(!file) return;
    try{
      uploadedImageData = await compressImage(file);
      imageUploadLabel.innerHTML = '';
      const img = document.createElement('img');
      img.src = uploadedImageData;
      imageUploadLabel.appendChild(img);
      imageUploadLabel.appendChild(articleImageInput);
    }catch(err){
      /* ignore - keep placeholder */
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const isEn = document.documentElement.lang === 'en';
    const title = document.getElementById('titleInput').value.trim();
    const content = document.getElementById('contentInput').value.trim();
    if(!title) return;

    publishBtn.disabled = true;
    publishBtn.textContent = isEn ? 'Submitting...' : 'جاري الإرسال...';
    statusEl.className = 'form-status';

    try{
      const res = await fetch(PENDING_ARTICLES_ENDPOINT, {
        method: 'POST',
        body: JSON.stringify({ ar: title, en: title, content, image: uploadedImageData, ts: Date.now() })
      });
      if(!res.ok) throw new Error('submit failed');

      statusEl.textContent = isEn ? 'Submitted for review - it will appear once approved. Redirecting...' : 'تم إرسال المقال للمراجعة - هيظهر بعد الموافقة عليه. جاري تحويلك...';
      statusEl.classList.add('show', 'ok');
      setTimeout(() => { window.location.href = '/articles.html'; }, 1600);
    }catch(err){
      statusEl.textContent = isEn ? 'Could not submit - check your connection and try again.' : 'تعذّر إرسال المقال - تحقق من الاتصال وحاول تاني.';
      statusEl.classList.add('show', 'err');
      publishBtn.disabled = false;
      publishBtn.textContent = isEn ? 'Submit for Review' : 'إرسال للمراجعة';
    }
  });
</script>

</body>
</html>
