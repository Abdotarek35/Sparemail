<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<script>
(function(){
  var t = localStorage.getItem('sparemail_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2591c9">
<title id="pageTitle">المقال - Sparemail</title>
<meta name="description" id="pageDescription" content="مقال من Sparemail">
<link rel="stylesheet" href="/pages.css">
</head>
<body>

<div class="page-wrap">
  <div class="site-header">
    <a class="site-logo" href="/" onclick="event.preventDefault(); location.replace('/');">
      <img src="/favicon.png" alt="Sparemail">
      <span>Sparemail</span>
    </a>
    <div class="header-controls">
      <button class="header-toggle-btn" id="themeToggleBtn" aria-label="تبديل الوضع الليلي/النهاري" title="الوضع الليلي/النهاري">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button class="header-toggle-btn" id="langToggleBtn" aria-label="Switch language" title="EN / AR">
        <span data-ar="EN" data-en="AR">EN</span>
      </button>
    </div>
    <a class="back-link" href="/articles.html" onclick="event.preventDefault(); location.replace('/articles.html');">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span data-ar="المقالات" data-en="Articles">المقالات</span>
    </a>
  </div>

  <div class="page-card" id="articleCard">
    <p class="empty-note" data-ar="جاري تحميل المقال..." data-en="Loading article...">جاري تحميل المقال...</p>
  </div>
</div>

<div class="site-footer">
  <a href="/" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
  <a href="/articles.html" data-ar="المقالات" data-en="Articles">المقالات</a>
  <a href="/about.html" data-ar="من نحن" data-en="About">من نحن</a>
  <a href="/contact.html" data-ar="تواصل معنا" data-en="Contact">تواصل معنا</a>
  <a href="/privacy.html" data-ar="سياسة الخصوصية" data-en="Privacy Policy">سياسة الخصوصية</a>
  <a href="/terms.html" data-ar="الشروط والأحكام" data-en="Terms">الشروط والأحكام</a>
</div>

<script src="/pages.js"></script>
<script>
  const FIREBASE_URL = 'https://sparemail-87ef2-default-rtdb.europe-west1.firebasedatabase.app';
  const articleCard = document.getElementById('articleCard');

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  async function loadArticle(){
    const isEn = document.documentElement.lang === 'en';
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if(!id){
      articleCard.innerHTML = `<p class="empty-note">${isEn ? 'No article specified.' : 'مفيش مقال محدد.'} <a href="/articles.html">${isEn ? 'Back to articles' : 'ارجع لقائمة المقالات'}</a>.</p>`;
      return;
    }

    try{
      const res = await fetch(`${FIREBASE_URL}/articles/${encodeURIComponent(id)}.json`);
      if(!res.ok) throw new Error('fetch failed');
      const article = await res.json();

      if(!article){
        articleCard.innerHTML = `<p class="empty-note">${isEn ? 'This article no longer exists.' : 'المقال ده مش موجود أو اتحذف.'} <a href="/articles.html">${isEn ? 'Back to articles' : 'ارجع لقائمة المقالات'}</a>.</p>`;
        return;
      }

      document.title = `${article.ar} - Sparemail`;
      document.getElementById('pageTitle').textContent = `${article.ar} - Sparemail`;
      const descText = (article.content || article.ar || '').slice(0, 155);
      document.getElementById('pageDescription').setAttribute('content', descText);

      const imageHtml = article.image
        ? `<img src="${article.image}" alt="">`
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';

      const noContentText = isEn ? 'No additional content for this article.' : 'مفيش محتوى إضافي لهذا المقال.';

      articleCard.innerHTML = `
        <div class="article-detail-image">${imageHtml}</div>
        <h1 class="page-title">${escapeHtml(article.ar)}</h1>
        <p class="article-detail-content">${escapeHtml(article.content || noContentText)}</p>
      `;
    }catch(err){
      articleCard.innerHTML = `<p class="empty-note">${isEn ? 'Could not load the article - check your connection.' : 'تعذّر تحميل المقال - تحقق من الاتصال.'}</p>`;
    }
  }

  loadArticle();
</script>

</body>
</html>
