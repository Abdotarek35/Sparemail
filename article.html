<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2591c9">
<title id="pageTitle">المقال - Sparemail</title>
<meta name="description" id="pageDescription" content="مقال من Sparemail">
<link rel="stylesheet" href="/pages.css">
</head>
<body>

<div class="page-wrap">
  <div class="site-header">
    <a class="site-logo" href="/">
      <img src="/favicon.png" alt="Sparemail">
      <span>Sparemail</span>
    </a>
    <a class="back-link" href="/articles.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      المقالات
    </a>
  </div>

  <div class="page-card" id="articleCard">
    <p class="empty-note">جاري تحميل المقال...</p>
  </div>
</div>

<div class="site-footer">
  <a href="/">الرئيسية</a>
  <a href="/articles.html">المقالات</a>
  <a href="/about.html">من نحن</a>
  <a href="/contact.html">تواصل معنا</a>
  <a href="/privacy.html">سياسة الخصوصية</a>
  <a href="/terms.html">الشروط والأحكام</a>
</div>

<script>
  const FIREBASE_URL = 'https://sparemail-87ef2-default-rtdb.europe-west1.firebasedatabase.app';
  const articleCard = document.getElementById('articleCard');

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  async function loadArticle(){
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    if(!id){
      articleCard.innerHTML = '<p class="empty-note">مفيش مقال محدد. <a href="/articles.html">ارجع لقائمة المقالات</a>.</p>';
      return;
    }

    try{
      const res = await fetch(`${FIREBASE_URL}/articles/${encodeURIComponent(id)}.json`);
      if(!res.ok) throw new Error('fetch failed');
      const article = await res.json();

      if(!article){
        articleCard.innerHTML = '<p class="empty-note">المقال ده مش موجود أو اتحذف. <a href="/articles.html">ارجع لقائمة المقالات</a>.</p>';
        return;
      }

      document.title = `${article.ar} - Sparemail`;
      document.getElementById('pageTitle').textContent = `${article.ar} - Sparemail`;
      const descText = (article.content || article.ar || '').slice(0, 155);
      document.getElementById('pageDescription').setAttribute('content', descText);

      const imageHtml = article.image
        ? `<img src="${article.image}" alt="">`
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';

      articleCard.innerHTML = `
        <div class="article-detail-image">${imageHtml}</div>
        <h1 class="page-title">${escapeHtml(article.ar)}</h1>
        <p class="article-detail-content">${escapeHtml(article.content || 'مفيش محتوى إضافي لهذا المقال.')}</p>
      `;
    }catch(err){
      articleCard.innerHTML = '<p class="empty-note">تعذّر تحميل المقال - تحقق من الاتصال.</p>';
    }
  }

  loadArticle();
</script>

</body>
</html>
